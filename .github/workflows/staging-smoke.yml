name: staging-smoke

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  staging-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS deps
        working-directory: js-e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: js-e2e
        run: npx playwright install --with-deps chromium

      - name: Wait for staging deploy
        env:
          STAGING_DEPLOY_WAIT_SECONDS: ${{ vars.STAGING_DEPLOY_WAIT_SECONDS }}
        run: |
          seconds="${STAGING_DEPLOY_WAIT_SECONDS:-90}"
          echo "Waiting ${seconds}s to allow Railway staging deploy to restart the bot..."
          sleep "${seconds}"

      - name: Restore Discord auth state
        working-directory: js-e2e
        env:
          DISCORD_AUTH_JSON_GZ_B64: ${{ secrets.DISCORD_AUTH_JSON_GZ_B64 }}
        run: |
          if [ -z "$DISCORD_AUTH_JSON_GZ_B64" ]; then
            echo "Missing GitHub Actions secret DISCORD_AUTH_JSON_GZ_B64."
            echo "Create it by gzip+base64 encoding js-e2e/discord-auth.json and adding it as a repository secret:"
            echo "  gzip -c js-e2e/discord-auth.json | base64 -w0"
            exit 1
          fi
          echo "$DISCORD_AUTH_JSON_GZ_B64" | base64 -d | gunzip -c > discord-auth.json
          node -e "const fs=require('fs'); const p='discord-auth.json'; if(!fs.existsSync(p) || fs.statSync(p).size===0){ process.exit(1);}"

      - name: Run Playwright changelog smoke test
        working-directory: js-e2e
        env:
          DISCORD_TEST_GUILD_ID: ${{ vars.DISCORD_TEST_GUILD_ID }}
          DISCORD_TEST_CHANNEL_ID: ${{ vars.DISCORD_TEST_CHANNEL_ID }}
          QASE_MODE: ${{ secrets.QASE_TESTOPS_API_TOKEN && 'testops' || 'off' }}
          QASE_TESTOPS_PROJECT: DKP
          QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TESTOPS_API_TOKEN }}
          QASE_TESTOPS_RUN_TITLE: "staging-smoke #${{ github.run_number }} (${{ github.sha }})"
          QASE_TESTOPS_RUN_DESCRIPTION: "GitHub Actions run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: npx playwright test tests/changelog-smoke.e2e.spec.js
